# =============================================================================
# CommonGround Co-op — Edge Gateway (NGINX reverse proxy)
# -----------------------------------------------------------------------------
# Deploys on the on-site Raspberry Pi (or similar) that bridges ESP32 sensors
# to the local telemetryIngestor Node service. The Pi terminates TLS so that
# secrets, signatures, and idempotency keys never traverse plaintext Wi-Fi.
#
# Two TLS modes:
#   (A) Self-signed for closed networks (factory default — see setup-pi.sh)
#   (B) Let's Encrypt with HTTP-01 if the gateway has a public DNS name
#
# Drop this file into:
#       /etc/nginx/sites-available/commonground-gateway.conf
# Then symlink:
#       sudo ln -s /etc/nginx/sites-available/commonground-gateway.conf \
#                  /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: review the marked TODOs before going live.
# =============================================================================

# ---- shared rate-limit zones -------------------------------------------------
# 1 req/sec average per source IP, burst of 30 (a single gate event triggers
# at most a handful of retries; legitimate traffic stays well below the limit).
limit_req_zone $binary_remote_addr zone=cg_telemetry:10m rate=1r/s;

# Map signature-presence to an enforced state. Lets us return 400 BEFORE the
# Node service even sees the request when the header is missing entirely.
map $http_x_commonground_signature $cg_has_signature {
    default      0;
    "~^[a-f0-9]{64}$" 1;
}

# =============================================================================
# Plain-HTTP redirect (port 80 → 443)
# =============================================================================
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # Allow Let's Encrypt HTTP-01 to renew without breaking redirects.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS — the actual gateway
# =============================================================================
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;

    # TODO: replace with your Pi's hostname or LAN .local name.
    server_name gateway.local commonground-gateway.local;

    # ---- TLS certificate -----------------------------------------------------
    # Self-signed default. To switch to Let's Encrypt, point these at
    # /etc/letsencrypt/live/<your-host>/fullchain.pem & privkey.pem after
    # `certbot certonly --webroot -w /var/www/letsencrypt -d <your-host>`.
    ssl_certificate     /etc/nginx/ssl/commonground-gateway.crt;
    ssl_certificate_key /etc/nginx/ssl/commonground-gateway.key;

    # Modern profile — TLS 1.2 minimum; 1.3 preferred.
    # Ref: https://ssl-config.mozilla.org/ (intermediate, NGINX, 2026 May)
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache          shared:CGTLS:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;
    ssl_stapling               on;
    ssl_stapling_verify        on;

    # Diffie–Hellman parameters (generated by setup-pi.sh).
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # ---- hardening headers ---------------------------------------------------
    # Telemetry endpoint is machine-to-machine; CSP and HSTS still make sense
    # for the operator's browser if they hit /healthz manually.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Cache-Control             "no-store" always;

    # Identify the proxy to upstream and disable buffering for low-latency POSTs.
    proxy_http_version  1.1;
    proxy_set_header    Host               $host;
    proxy_set_header    X-Real-IP          $remote_addr;
    proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto  https;
    proxy_request_buffering off;
    proxy_buffering         off;

    # ---- request size caps ---------------------------------------------------
    # Gate packets are <256 B; anything larger is malformed or hostile.
    client_max_body_size  4k;
    client_body_buffer_size 4k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     30s;

    # ---- health check (no auth, no rate limit) ------------------------------
    location = /healthz {
        access_log  off;
        proxy_pass  http://127.0.0.1:3017/healthz;
    }

    # =========================================================================
    # Telemetry ingestion: POST /api/v1/telemetry/gate-state
    # =========================================================================
    # Rejected fast at the proxy if:
    #   * not POST
    #   * Content-Type isn't JSON
    #   * X-CommonGround-Signature is missing or not 64 hex chars
    #
    # All of those return 400/401 without touching the Node service, freeing
    # the upstream to spend its cycles on legitimate packets.
    location = /api/v1/telemetry/gate-state {
        # Method gate.
        if ($request_method != POST) {
            return 405;
        }

        # Signature header gate (set by the `map` block at top of file).
        if ($cg_has_signature = 0) {
            return 401;
        }

        # Content-Type gate.
        if ($content_type !~* "^application/json(;|$)") {
            return 415;
        }

        # Rate limit AFTER cheap header checks so denied requests don't burn
        # the limit. burst=30 absorbs ESP32 backoff retries; nodelay rejects
        # immediately past burst.
        limit_req zone=cg_telemetry burst=30 nodelay;

        proxy_pass http://127.0.0.1:3017/api/v1/telemetry/gate-state;
        proxy_read_timeout 8s;
    }

    # Anything else under /api/ — explicit 404 (don't leak NGINX defaults).
    location /api/ {
        return 404;
    }

    # Catch-all: deny silently to reduce attack surface.
    location / {
        return 404;
    }
}
